<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | ACESO Foundation</title>
  <style>
    :root{color-scheme:light;--ink:#0a1626;--azure:#1e57a3;--paper:#f5f8fc;--line:rgba(10,22,38,.14)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#fff,var(--paper));color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(680px,100%);padding:clamp(32px,7vw,72px);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(10,30,70,.12)}
    .eyebrow{color:var(--azure);font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{font-size:clamp(2.4rem,8vw,5rem);line-height:.95;letter-spacing:-.04em;margin:.5rem 0 1.2rem}
    p{font-size:1.08rem;line-height:1.65;color:#33455c;margin:0 0 1.5rem}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    a{display:inline-flex;padding:12px 20px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font-weight:700;text-decoration:none}
    a.primary{background:var(--azure);border-color:var(--azure);color:#fff}
    a:focus-visible{outline:3px solid #f5b942;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ACESO Foundation · 404</div>
    <h1>This page has moved.</h1>
    <p>The address may be outdated. Return to the ACESO homepage or email our student-led team for help.</p>
    <div class="actions">
      <a class="primary" href="/">Go to the homepage</a>
      <a href="mailto:info@acesoworld.com?subject=Website%20inquiry">Email ACESO</a>
    </div>
  </main>
</body>
</html>
